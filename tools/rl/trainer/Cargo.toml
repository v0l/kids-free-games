[package]
name = "kg-trainer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
kg_core = { path = "../../../crates/core" }
candle-core = "0.11"
candle-nn = "0.11"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[profile.release]
opt-level = 3
lto = "thin"
debug = false

[workspace]
