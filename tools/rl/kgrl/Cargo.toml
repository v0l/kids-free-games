[package]
name = "kgrl"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kgrl"
crate-type = ["cdylib"]

[dependencies]
kg_core = { path = "../../../crates/core" }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"

[profile.release]
opt-level = 3
lto = "thin"

