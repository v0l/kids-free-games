name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, like v0.1.0. Builds only: nothing is published unless a tag was pushed."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, workspace version and changelog
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$TAG' is not a version tag like v0.1.0."
            exit 1
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version in Cargo.toml."
            exit 1
          fi
          awk -v v="$version" '/^## \[/{p=index($0,"[" v "]")>0;next} /^\[[^]]*\]: /{p=0} p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi

  desktop:
    needs: check
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p kids_games --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="kids_games-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin_dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${bin_dir}/kids_games.exe" "dist/${name}/"
          else
            cp "${bin_dir}/kids_games" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${name}"
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: wasm-bindgen and binaryen
        run: |
          version=$(awk '/name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,"",$0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen

      - name: Build
        run: scripts/web.sh

      - name: Zip
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/kids_games-web-${TAG#v}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*
          if-no-files-found: error

  android:
    needs: check
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/**') }}

      - name: SDK, build tools and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Decode Play upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 is not set: the AAB must be signed with the Play upload key."
              exit 1
            fi
            echo "::warning::PLAY_UPLOAD_* secrets are not set: this dry run signs the AAB with the APK key."
          else
            echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.keystore"
            echo "KG_BUNDLE_KEYSTORE=$RUNNER_TEMP/play-upload.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build and sign
        env:
          BUNDLE: "1"
          KG_BUNDLE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KG_BUNDLE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          KG_BUNDLE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KG_KEYSTORE: ${{ runner.temp }}/release.keystore
          KG_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KG_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KG_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./scripts/android.sh

      - name: Name the artifact after the tag
        run: |
          mkdir -p dist
          cp target/android-artifacts/kids_games.apk "dist/kids_games-${TAG}-android-arm64.apk"
          cp target/android-artifacts/kids_games.aab "dist/kids_games-${TAG}-android.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [desktop, web, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          awk -v v="${TAG#v}" '/^## \[/{p=index($0,"[" v "]")>0;next} /^\[[^]]*\]: /{p=0} p' CHANGELOG.md > notes.md
          {
            echo
            echo "iOS and the app stores are not built here."
          } >> notes.md
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
