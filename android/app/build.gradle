plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.v0l.kids_games'
    compileSdk 36

    defaultConfig {
        applicationId "io.v0l.kidsgames"
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
        versionName "1.0"
        ndk {
            abiFilters(project.findProperty('abi') ?: 'arm64-v8a')
        }
    }
    signingConfigs {
        upload {
            def ks = System.getenv('KG_KEYSTORE') ?: new File(rootDir, 'missing.jks').path
            def pw = System.getenv('KG_KEYSTORE_PASSWORD') ?: ''
            storeFile file(ks)
            storePassword pw
            keyAlias System.getenv('KG_KEY_ALIAS') ?: 'upload'
            keyPassword pw
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KG_KEYSTORE') ? signingConfigs.upload : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.games.activity
}
