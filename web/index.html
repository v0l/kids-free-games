<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Games">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Kids Free Games</title>
<style>
html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: #ffb478; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>var register_plugin;</script>
<script src="mq_js_bundle.js"></script>
<script>
miniquad_add_plugin({name: "kg_save", version: 1, register_plugin: function (o) {
  var key = "kids-free-games-save";
  o.env.kg_save_len = function () { try { return new TextEncoder().encode(localStorage.getItem(key) || "").length; } catch (e) { return 0; } };
  o.env.kg_save_read = function (ptr, len) { var b = new TextEncoder().encode(localStorage.getItem(key) || ""); new Uint8Array(wasm_memory.buffer, ptr, len).set(b.subarray(0, len)); };
  o.env.kg_save_write = function (ptr, len) { try { localStorage.setItem(key, new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len))); } catch (e) {} };
}});
</script>
<script>
miniquad_add_plugin({name: "kg_http", version: 1, register_plugin: function (o) {
  var jobs = {}, next = 0, dec = new TextDecoder(), enc = new TextEncoder();
  function str(ptr, len) { return len ? dec.decode(new Uint8Array(wasm_memory.buffer, ptr, len)) : ""; }
  o.env.kg_http_start = function (mp, ml, up, ul, tp, tl, bp, bl) {
    var id = ++next, method = str(mp, ml), headers = {}, token = str(tp, tl), body = str(bp, bl);
    if (token) headers["Authorization"] = "Bearer " + token;
    if (body) headers["Content-Type"] = "application/json";
    var job = jobs[id] = { status: 0, bytes: new Uint8Array(0) };
    fetch(str(up, ul), { method: method, headers: headers, body: body || undefined })
      .then(function (r) { return r.text().then(function (t) { job.bytes = enc.encode(t); job.status = r.status || -1; }); })
      .catch(function () { job.status = -1; });
    return id;
  };
  o.env.kg_http_status = function (id) { return jobs[id] ? jobs[id].status : -1; };
  o.env.kg_http_len = function (id) { return jobs[id] ? jobs[id].bytes.length : 0; };
  o.env.kg_http_read = function (id, ptr, len) { if (jobs[id]) new Uint8Array(wasm_memory.buffer, ptr, len).set(jobs[id].bytes.subarray(0, len)); };
  o.env.kg_http_free = function (id) { delete jobs[id]; };
}});
</script>
<script>load("kids_games.wasm");</script>
</body>
</html>
