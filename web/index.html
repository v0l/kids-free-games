<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Games">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Kids Free Games</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: #ffb478; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<canvas id="bevy" tabindex="1"></canvas>
<script>
(function () {
  var made = [];
  var Real = window.AudioContext || window.webkitAudioContext;
  if (!Real) return;
  function Ctx(opts) { var c = new Real(opts); made.push(c); return c; }
  Ctx.prototype = Real.prototype;
  window.AudioContext = Ctx;
  function wake() { made.forEach(function (c) { if (c.state !== "running") c.resume(); }); }
  ["pointerdown", "touchend", "keydown"].forEach(function (e) { window.addEventListener(e, wake, true); });
  window.kgAudioState = function () { return made.map(function (c) { return c.state; }).join(","); };
})();
</script>
<script type="module">
import init from "./kids_games.js";
init();
document.getElementById("bevy").focus();
</script>
</body>
</html>
