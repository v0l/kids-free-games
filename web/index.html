<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Games">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Kids Free Games</title>
<style>
html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: #ffb478; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>var register_plugin;</script>
<script src="mq_js_bundle.js"></script>
<script>
miniquad_add_plugin({name: "kg_save", version: 1, register_plugin: function (o) {
  var key = "kids-free-games-save";
  o.env.kg_save_len = function () { try { return new TextEncoder().encode(localStorage.getItem(key) || "").length; } catch (e) { return 0; } };
  o.env.kg_save_read = function (ptr, len) { var b = new TextEncoder().encode(localStorage.getItem(key) || ""); new Uint8Array(wasm_memory.buffer, ptr, len).set(b.subarray(0, len)); };
  o.env.kg_save_write = function (ptr, len) { try { localStorage.setItem(key, new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len))); } catch (e) {} };
}});
</script>
<script>load("kids_games.wasm");</script>
</body>
</html>
