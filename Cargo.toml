[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/kids-free-games"

[workspace.dependencies]
glam = { version = "0.33", default-features = false, features = ["std", "i32"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
