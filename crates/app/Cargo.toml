[package]
name = "kids_games"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "kids_games"
path = "src/main.rs"

[dependencies]
kg_core = { path = "../core" }
glam.workspace = true
image = { version = "0.25", default-features = false }
quad-rand = "0.2"
serde_json = "1"
cpal = "0.17"
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite_render",
  "bevy_state",
  "mouse",
  "keyboard",
  "touch",
] }

[target.'cfg(all(unix, not(target_os = "android"), not(target_os = "ios"), not(target_os = "macos")))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["android-game-activity"] }
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["webgl2", "web"] }
cpal = { version = "0.17", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "UrlSearchParams"] }
