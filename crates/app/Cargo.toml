[package]
name = "kids_games"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "kids_games"
path = "src/main.rs"

[dependencies]
kg_core = { path = "../core" }
glam.workspace = true
image = { version = "0.25", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gcad-bevy = { git = "https://github.com/v0l/gcad-engines", rev = "aa1b4c37018ae32b2bf8e48baccce842a6afb39d", default-features = false }
cpal = "0.17"
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite_render",
  "bevy_pbr",
  "bevy_light",
  "bevy_world_serialization",
  "bevy_animation",
  "bevy_scene",
  "bevy_curve",
  "jpeg",
  "debug",
  "reflect_auto_register",
  
  "mouse",
  "keyboard",
  "touch",
  "gamepad",
] }

[target.'cfg(all(unix, not(target_os = "android"), not(target_os = "ios"), not(target_os = "macos")))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcad-bevy = { git = "https://github.com/v0l/gcad-engines", rev = "aa1b4c37018ae32b2bf8e48baccce842a6afb39d", default-features = false, features = ["parallel"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["android-game-activity"] }
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
gcad2glb = { git = "https://github.com/v0l/gcad", rev = "5a5fde3abba0c6199e1214f287b9671504aceac4", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["webgl2", "web"] }
cpal = { version = "0.17", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "UrlSearchParams"] }
